# Memory Configuration (Tuned for ~1GB RAM allocation)
shared_buffers = 256MB
work_mem = 16MB
maintenance_work_mem = 64MB

# Connection Settings
max_connections = 50

# Logging Configuration (Crucial for DBA troubleshooting)
logging_collector = off
log_destination = 'stderr'
log_min_duration_statement = 0 # Log any query taking longer than 100ms
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %u@%d: '
